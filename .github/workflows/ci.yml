name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  backend:
    name: Java e MySQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: obrigacoes
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: obrigacoes/pom.xml
      - name: Testes unitarios, integracao e pacote
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify
      - name: Relatorios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-backend
          path: obrigacoes/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Flutter e build web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - run: flutter build web --release
      - name: Artefato web
        uses: actions/upload-artifact@v4
        with:
          name: frontend-web
          path: frontend/build/web/
          if-no-files-found: error
          retention-days: 7

  android:
    name: Flutter Android debug
    needs: [frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug
      - name: Artefato APK Android
        uses: actions/upload-artifact@v4
        with:
          name: frontend-android-debug
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  compose:
    name: Integracao dos conteineres
    needs: [backend, frontend, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Gerar credenciais temporarias para o MySQL de teste
        run: |
          echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "MYSQL_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Validar configuracao e iniciar servicos
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 180
      - name: Verificar frontend e acesso da API ao banco
        shell: bash
        run: |
          for tentativa in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/empresas; then
              break
            fi
            printf 'Aguardando API (%s/60)...\n' "$tentativa"
            sleep 2
          done
          curl --fail --silent --show-error http://localhost:8080/empresas
          curl --fail --silent --show-error http://localhost:8080/catalogo-obrigacoes
          curl --fail --silent --show-error http://localhost:8080/actuator/health
          curl --fail --silent --show-error http://localhost:8080/v3/api-docs --output /dev/null
          curl --fail --silent --show-error http://localhost:3000/ --output /dev/null
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Encerrar o ambiente temporario do runner
        if: always()
        run: docker compose down --volumes
