services:
  mysql:
    image: mysql:8.4
    container_name: obrigacoes-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-obrigacoes}
      MYSQL_USER: ${MYSQL_USER:-obrigacoes}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD in .env}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP
          --host=127.0.0.1 --user="$${MYSQL_USER}" "$${MYSQL_DATABASE}"
          --execute="SELECT 1" > /dev/null 2>&1
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

  backend:
    build:
      context: ./obrigacoes
      dockerfile: Dockerfile

    container_name: obrigacoes-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-obrigacoes}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-obrigacoes}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD in .env}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}

    ports:
      - "8080:8080"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: obrigacoes-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "3000:3000"

volumes:
  mysql_data:
